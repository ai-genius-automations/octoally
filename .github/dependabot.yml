# Dependabot version updates: one grouped PR a month, no major-version bumps.
# Security updates are separate and stay on regardless of the ignore rule below.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/dashboard"
      - "/desktop-electron"
      - "/server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
